[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fovea-sdk"
version = "0.1.0"
description = "Python SDK for Fovea-4B: calibrated single-pass decisions about images over TypeSafe's System One API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Sivasuthan Sukumar"}]
keywords = ["vision-language", "decision-model", "calibration", "jev", "systemone", "fovea"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = []

[project.optional-dependencies]
# Running the model yourself (FoveaLocal, `fovea-sdk serve`). Blackwell GPUs need a CUDA >= 12.8 build of torch; see README.
local = [
    "torch>=2.6",
    "torchvision",
    "transformers>=5.16,<6",
    "tokenizers",
    "safetensors",
    "huggingface_hub",
    "numpy",
    "pillow",
    "fla-core>=0.5.2",
    "flash-linear-attention>=0.5.2",
    "einops",
]

[project.scripts]
fovea-sdk = "fovea_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/Sivasuthan9/fovea"
Model = "https://huggingface.co/Sivasuthan/fovea-4b"

[tool.setuptools]
packages = ["fovea_sdk"]
